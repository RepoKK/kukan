# Apache vhost for kukanjiten.com after the gunicorn cutover.
#
# INSTALL AS:  /etc/httpd/conf.d/kukan.conf
#
# Apache keeps everything it is good at — TLS, static files, the ACME webroot —
# and hands the application off to gunicorn over loopback. It no longer loads
# Python: the WSGIDaemonProcess / WSGIScriptAlias block this replaces is gone.
#
# Requires mod_proxy, mod_proxy_http and mod_headers:
#     httpd -M | grep -E 'proxy_module|proxy_http_module|headers_module'
# All three ship enabled by default on CentOS Stream 9 via
# /etc/httpd/conf.modules.d/00-proxy.conf and 00-base.conf.
#
# ORDERING MATTERS. Read the comment above the /.well-known block before
# changing anything in the :443 vhost.

# --- Paths --------------------------------------------------------------------
# Kept in one place because they must agree with three other files:
#   /home/fred/kukan            WorkingDirectory in deploy/kukan.service
#   .../static                  STATIC_ROOT in kukansite/settings/base.py
#   .../.well-known             the `-w` webroot in prod.py's certbot CRON_CFG
Define KUKAN_ROOT   /home/fred/kukan
Define KUKAN_STATIC /home/fred/kukan/static
Define KUKAN_ACME   /home/fred/kukan/.well-known


<VirtualHost *:80>
    ServerName  kukanjiten.com
    ServerAlias www.kukanjiten.com

    # The ACME http-01 challenge is served over plain HTTP, by definition —
    # certbot is proving control of the name in order to *get* a certificate,
    # so it cannot require one. This must come before the redirect below, or
    # Let's Encrypt follows a 301 to https, and renewal fails every time.
    Alias /.well-known/ ${KUKAN_ACME}/
    <Directory ${KUKAN_ACME}>
        Require all granted
        Options -Indexes
    </Directory>

    RedirectMatch permanent ^(?!/\.well-known/)(.*)$ https://kukanjiten.com$1

    ErrorLog  logs/kukan_http_error.log
    CustomLog logs/kukan_http_access.log combined
</VirtualHost>


<VirtualHost *:443>
    ServerName  kukanjiten.com
    ServerAlias www.kukanjiten.com

    SSLEngine on
    SSLCertificateFile    /home/fred/letsencrypt/config/live/kukanjiten.com/fullchain.pem
    SSLCertificateKeyFile /home/fred/letsencrypt/config/live/kukanjiten.com/privkey.pem

    # ---------------------------------------------------------------------
    # Everything Apache serves itself goes ABOVE the ProxyPass, and each one
    # needs its own `ProxyPass ... !` exclusion.
    #
    # mod_proxy evaluates ProxyPass rules in the order they appear and takes
    # the first match. `ProxyPass / http://...` matches every URL, so a bare
    # Alias below it is dead: Apache proxies the request instead of reading
    # the file. For /static that is a slow page. For /.well-known it is a lost
    # certificate — certbot writes the challenge token to the webroot, Apache
    # proxies the challenge URL to gunicorn, Django answers 404 (its
    # `static()` urlpattern is DEBUG-only and does nothing in production),
    # Let's Encrypt sees the 404 and the renewal fails. Silently, at 01:23,
    # until the certificate expires.
    #
    # This is the single most common way to lose the certificate during an
    # mod_wsgi -> proxy migration. kukansite/tests_deploy.py asserts the
    # ordering so it cannot regress.
    # ---------------------------------------------------------------------

    ProxyPass /.well-known/ !
    Alias     /.well-known/ ${KUKAN_ACME}/
    <Directory ${KUKAN_ACME}>
        Require all granted
        Options -Indexes
    </Directory>

    ProxyPass /static/ !
    Alias     /static/ ${KUKAN_STATIC}/
    <Directory ${KUKAN_STATIC}>
        Require all granted
        Options -Indexes
        # Hashed filenames are not in use, so cache conservatively.
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 1 hour"
        </IfModule>

        # Fonts are the exception, and they have to be: the stroke-order face
        # is 6.6 MB, and under the one-hour default every visit to a kanji
        # detail page an hour apart re-downloads all of it.
        #
        # They are safe to pin because their filenames already carry a version
        # — KanjiStrokeOrders_v4.005.woff2, materialdesignicons-webfont.woff2
        # from a pinned @mdi/font — so a new version is a new URL and a stale
        # cache entry cannot serve the wrong file. That is the same property
        # hashed filenames would give, obtained by hand.
        #
        # Matched on extension rather than ExpiresByType because Apache does
        # not map .woff2 to a MIME type on a stock EL9 install, so
        # `ExpiresByType font/woff2` would silently never fire. Cache-Control
        # also takes precedence over the Expires header above, so this wins
        # without having to exclude fonts from ExpiresDefault.
        <IfModule mod_headers.c>
            <FilesMatch "\.(woff2?|ttf|eot|otf)$">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
        </IfModule>
    </Directory>

    # --- The application ---------------------------------------------------
    # Must be last: it matches everything not excluded above.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/ retry=0
    ProxyPassReverse / http://127.0.0.1:8000/

    # Django needs the original scheme. prod.py sets
    # SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https') and
    # SECURE_SSL_REDIRECT = True: without this header Django sees plain http,
    # redirects to https, Apache proxies the new request, Django sees http
    # again — an infinite redirect loop, on every page.
    #
    # `set`, not `setifempty`: a client-supplied X-Forwarded-Proto must be
    # overwritten, not trusted. Combined with gunicorn's
    # forwarded_allow_ips = 127.0.0.1, the header can only originate here.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # An Anki export or a kanjipedia scrape can outlast the default 60s.
    # Slightly under gunicorn's own 120s timeout, so the worker's error is the
    # one that gets logged rather than a bare Apache 504.
    ProxyTimeout 110

    ErrorLog  logs/kukan_error.log
    CustomLog logs/kukan_access.log combined
</VirtualHost>
