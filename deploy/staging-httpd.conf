# Staging httpd: TLS terminator and static file server, proxying the
# application to gunicorn.
#
# This is the shape production moves to in Stage 7. Today production has httpd
# talking to the application in-process through mod_wsgi; here it talks to a
# separate gunicorn over loopback. Rehearsing that split is the whole reason
# this container exists.
#
# Kept structurally identical to deploy/kukanjiten-httpd.conf — same ordering,
# same exclusions, same headers — so that rehearsing here rehearses the real
# thing. kukansite/tests_deploy.py checks both files against the same rules.
# The differences are only the port, the certificate and the paths.

# Staging owns both ports. The stock `Listen 80` and mod_ssl's conf.d/ssl.conf
# are removed by the Containerfile, because two files declaring the same port
# is a fatal "Cannot define multiple Listeners on the same IP:port".
Listen 8080
Listen 8443 https


# The plain-HTTP vhost, standing in for production's *:80.
#
# This is where the ACME http-01 challenge is actually served: certbot is
# proving control of the name in order to *get* a certificate, so it cannot be
# asked to present one first. Staging previously only exercised /.well-known
# over TLS, which is the one place it never matters.
<VirtualHost *:8080>
    ServerName localhost

    Alias /.well-known/ /opt/kukan/.well-known/
    <Directory /opt/kukan/.well-known/>
        Require all granted
        Options -Indexes
    </Directory>

    # Everything except the challenge goes to https. The negative lookahead is
    # the whole point: redirect /.well-known too and Let's Encrypt follows a
    # 301 to a certificate that does not exist yet.
    RedirectMatch permanent ^(?!/\.well-known/)(.*)$ https://localhost:8443$1

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>


<VirtualHost *:8443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile      /etc/pki/tls/certs/kukan-staging.crt
    SSLCertificateKeyFile   /etc/pki/tls/private/kukan-staging.key

    # ---------------------------------------------------------------------
    # Everything httpd serves itself goes ABOVE the catch-all ProxyPass, each
    # with its own `ProxyPass ... !` exclusion. mod_proxy takes the first
    # matching rule, so `ProxyPass /` below would otherwise swallow these.
    #
    # /.well-known has no function in staging — there is no ACME challenge for
    # a self-signed certificate. It is here precisely because it has none: if
    # the ordering is wrong, this is where it shows up harmlessly, instead of
    # on the box where getting it wrong costs the certificate.
    # ---------------------------------------------------------------------

    ProxyPass /.well-known/ !
    Alias     /.well-known/ /opt/kukan/.well-known/
    <Directory /opt/kukan/.well-known/>
        Require all granted
        Options -Indexes
    </Directory>

    # Static files are served by httpd, not by the application. Django's
    # runserver hides mistakes here; this does not.
    ProxyPass /static/ !
    Alias     /static/ /opt/kukan/static/
    <Directory /opt/kukan/static/>
        Require all granted
        Options -Indexes
    </Directory>

    # The application. Must be last: it matches everything not excluded above.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/ retry=0
    ProxyPassReverse / http://127.0.0.1:8000/

    # Django needs these to build absolute URLs and to know the original
    # scheme; without X-Forwarded-Proto it will redirect https -> http.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "8443"

    ProxyTimeout 110

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
