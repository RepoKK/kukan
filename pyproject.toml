[project]
name = "kukan"
version = "0.1.0"
description = "Kanji study material for the Kanken exam, behind kukanjiten.com"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"

# Direct dependencies only; uv.lock pins the full transitive set. Most are left
# unconstrained deliberately — the lock file is the pin, and re-resolving is
# how a refresh happens. The ones with bounds have a reason, given below.
#
# Remaining staged upgrades:
#   Django 6.0     -> stage 6
#   PSNAWP 3.0.3   -> stage 8
dependencies = [
    # Stage 6 walks 4.2 -> 5.0 -> 5.1 -> 5.2 -> 6.0, one minor per commit with
    # the suite green at each, so a regression is attributable to one release.
    "Django>=5.1,<5.2",
    # PINNED CEILING: anki 25.02+ ships manylinux_2_35 wheels and the prod host
    # (CentOS Stream 9) has glibc 2.34, so 24.11 is the highest usable version.
    # Do not bump without checking `ldd --version` on the box.
    "anki==24.11",
    "dropbox",
    # Not used by the application yet: production still runs Apache+mod_wsgi.
    # Present so the staging container can rehearse the stage 7 cutover.
    "gunicorn>=21.2",
    "html2text",
    "Janome",
    "lxml",
    "Markdown",
    "pandas",
    "PSNAWP==1.3.3",
    "requests",
]

[dependency-groups]
dev = [
    "coverage[toml]",
    "freezegun",
    "pyfakefs",
    "ruff>=0.9",
]

[tool.ruff]
# 120 rather than the plan's 100: 231 existing lines exceed 100 but only 27
# exceed 120. Reformatting 231 lines during a modernization buries the changes
# that matter in whitespace churn.
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]
ignore = [
    # RUF001/2/3 flag "ambiguous" Unicode. This codebase is largely Japanese,
    # where 全角 punctuation （）、。 is correct and not a confusable typo, and
    # the rule fires 99 times on it.
    #
    # It is also actively dangerous here: its first hit is the U+00A0 in
    # `bustime/views.py`, which it suggests replacing with a plain space. That
    # character is load-bearing — tobus.jp emits &nbsp; in the table header and
    # the comparison must match it, so "fixing" it silently empties the bus
    # timetable. See `bustime.tests.GetBusTimeTest
    # .test_header_match_depends_on_a_non_breaking_space`.
    "RUF001",
    "RUF002",
    "RUF003",
    # Mutable class attributes are the Django idiom: `fixtures = [...]`,
    # `filters = [...]`, `INSTALLED_APPS`. 53 hits, all of them correct code.
    "RUF012",
    # Model body ordering (fields, then Meta, then methods). Cosmetic, and
    # reordering model bodies during a migration-sensitive refactor is not a
    # trade worth making.
    "DJ012",
    # KanjiDetails is a pure one-to-one extension of Kanji and is never
    # rendered on its own, so it has no meaningful __str__ to define.
    "DJ008",
]

[tool.ruff.lint.per-file-ignores]
# Settings modules use star-imports by design, and the trailing
# `from kukansite.settings_prod import *` is what stage 4 removes.
"kukansite/settings.py" = ["F403", "F405"]
# `kukan/views.py` does `from .filters import *`, which also brings in the
# json/Q names the module uses. Untangling that is stage 10's business.
"kukan/views.py" = ["F403", "F405"]
# Tests: long assertion literals are more readable left whole; nested `with`
# blocks separate "arrange" from "act"; and `it.repeat` in a default argument
# is an immutable iterator, not the mutable-default trap B008 guards against.
"**/tests.py" = ["E501", "SIM117", "B008"]
"**/tests_*.py" = ["E501", "SIM117", "B008"]
# The PSN live-test gate reads the lowercase `psn_token`, matching the variable
# the code and its own comment already use. Renaming it would break the
# existing workflow for no gain.
"tempmon/tests.py" = ["E501", "SIM117", "B008", "SIM112"]

[tool.ruff.lint.isort]
known-first-party = ["kukan", "kukansite", "bustime", "tempmon", "utils_django"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/tests_*.py",
    ".venv/*",
    "manage.py",
]

[tool.coverage.report]
sort = "miss"
