{% extends 'base_ext.html' %}

{% block title %}{{ list_title }}{% endblock %}

{% block content %}
<h1 class="title">{{ list_title }}</h1>

<form hx-get="{{ request.path }}" hx-target="#results" hx-push-url="true" hx-swap="outerHTML"
      hx-trigger="input changed delay:400ms, submit">
    {% for filter, value in filters %}
    <div class="field">
        <label class="label">{{ filter.label }}</label>
        <div class="control">
            <input class="input" type="text" name="{{ filter.label }}" value="{{ value }}">
        </div>
    </div>
    {% endfor %}
    <button class="button is-primary" type="submit">適用</button>
</form>

{% include 'ui/_table.html' %}
{% endblock %}
