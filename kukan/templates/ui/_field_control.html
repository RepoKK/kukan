{% comment %}
The control itself, split out only because `ui/_field.html` needs it in two
places (horizontal and stacked layouts) and Django templates have no macros.

Bulma styles a `<select>` through a wrapping `.select` div rather than a
class on the element, which is why that one case is wrapped here instead of
handled in `BulmaModelForm.widget_classes`.
{% endcomment %}
<div class="control{% if field.field.widget.input_type == 'select' %} is-expanded{% endif %}">
    {% if field.field.widget.input_type == 'select' %}
    <div class="select is-fullwidth">{{ field }}</div>
    {% else %}
    {{ field }}
    {% endif %}
</div>
{% for error in field.errors %}
<p class="help is-danger">{{ error }}</p>
{% endfor %}
