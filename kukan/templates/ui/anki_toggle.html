{% load icons %}
<span x-data="{
        inAnki: {{ in_anki|yesno:'true,false' }},
        busy: false,
        toggle() {
            const op = this.inAnki ? 'remove' : 'add';
            const message = this.inAnki
                ? '本当に日課の四字熟語の問題から外しますか。'
                : '日課に追加しますか。';
            if (!confirm(message)) return;
            this.busy = true;
            const body = new FormData();
            body.set('yoji', '{{ yoji_text|escapejs }}');
            body.set('op', op);
            fetch('{% url 'kukan:yoji_anki' %}', {
                method: 'POST',
                headers: {'X-CSRFToken': '{{ csrf_token }}'},
                body: body,
            }).then(r => r.json()).then(data => {
                this.busy = false;
                if (data.status === 'success') {
                    this.inAnki = data.in_anki === 'true';
                } else {
                    alert('日課に追加・削除の失敗');
                }
            }).catch(() => {
                this.busy = false;
                alert('日課に追加・削除の失敗');
            });
        }
    }">
    <span x-show="inAnki">{% icon 'check' size='is-small' %}</span>
    <a class="button is-small is-outlined"
       x-show="editEnabled"
       :class="[inAnki ? 'is-danger' : 'is-success', busy ? 'is-loading' : '']"
       @click="toggle">
        <span x-text="inAnki ? '解除' : '追加'"></span>
    </a>
</span>
